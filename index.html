<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Меню на неделю</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#FDF9F0; --card:#fff; --ink:#2C2A28; --mut:#8A8178;
    --hero:#FAD98A; --heroInk:#4A2E05; --heroAcc:#B5661A;
    --adult:#B5D4F4; --adultInk:#042C53; --adultAcc:#185FA5;
    --kid:#C0DD97; --kidInk:#173404; --kidAcc:#3B6D11;
    --rec:#FAC775; --recInk:#633806; --fav:#F4C0D1; --favInk:#72243E;
  }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); max-width:480px; margin:0 auto; padding:0 16px 92px; min-height:100vh; }
  .serif{ font-family:Georgia,"Times New Roman",serif; font-style:italic; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 2px 10px; }
  .hello{ font-size:14px; color:var(--mut); } .hello b{ color:var(--ink); font-weight:600; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:var(--fav); color:var(--favInk);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .wksw{ display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:14px;
    padding:8px 10px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,.05); }
  .wksw button{ background:#F3E9D6; border:none; width:34px; height:34px; border-radius:10px; font-size:16px;
    cursor:pointer; color:#7A4E12; } .wksw button:disabled{ opacity:.35; cursor:default; }
  .wksw .wk{ font-size:14px; font-weight:600; } .wksw .wk small{ color:var(--mut); font-weight:400; }
  .hero{ position:relative; background:var(--hero); border-radius:22px; padding:20px 16px 22px; margin-bottom:16px; overflow:hidden; }
  .hero h1{ font-size:28px; line-height:1.05; color:var(--heroInk); font-weight:800; }
  .hero .h2{ font-size:28px; line-height:1.05; color:var(--heroAcc); }
  .hero p{ font-size:12px; color:#7A4E12; margin-top:8px; max-width:150px; }
  .sticker1{ position:absolute; bottom:14px; left:14px; width:58px; height:58px; border-radius:50%;
    background:#ED93B1; color:#4B1528; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-8deg); }
  .sticker1 b{ font-size:18px; line-height:1; } .sticker1 span{ font-size:9px; }
  .sticker2{ position:absolute; bottom:58px; left:46px; padding:5px 11px; border-radius:14px;
    background:#97C459; color:#173404; font-size:10px; font-weight:600; transform:rotate(6deg); }
  .days{ display:flex; gap:6px; margin-bottom:16px; }
  .day{ flex:1; text-align:center; padding:9px 0; border-radius:13px; font-size:12px; background:#F0E7D6; color:#8A7A5C; border:none; cursor:pointer; font-family:inherit; }
  .day.on{ font-weight:700; }
  .sec-title{ font-size:14px; font-weight:600; margin:0 2px 10px; }
  .menu{ border-radius:18px; padding:14px 15px; margin-bottom:10px; }
  .menu.adult{ background:var(--adult); } .menu.kid{ background:var(--kid); }
  .menu .lbl{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; margin-bottom:8px; }
  .menu.adult .lbl{ color:var(--adultAcc); } .menu.kid .lbl{ color:var(--kidAcc); }
  .row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0; cursor:pointer; }
  .menu.adult .row{ color:var(--adultInk); } .menu.kid .row{ color:var(--kidInk); }
  .row .val{ display:flex; align-items:center; gap:6px; }
  .menu.adult .row .val{ color:var(--adultAcc); } .menu.kid .row .val{ color:var(--kidAcc); }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .tile{ border-radius:18px; padding:16px; cursor:pointer; }
  .tile.rec{ background:var(--rec); color:var(--recInk); } .tile.fav{ background:var(--fav); color:var(--favInk); }
  .tile .ic{ font-size:22px; } .tile .tt{ font-size:14px; font-weight:700; margin-top:8px; }
  .cta{ background:var(--ink); color:#fff; border:none; width:100%; border-radius:20px; padding:16px;
    font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; }
  .page-h{ font-size:22px; font-weight:800; margin:6px 2px 14px; } .page-h .serif{ color:var(--heroAcc); }
  .listcard{ background:var(--card); border-radius:16px; padding:14px 15px; margin-bottom:10px; box-shadow:0 1px 6px rgba(0,0,0,.04); }
  .listcard .dish{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .listcard .dish .em{ font-size:22px; } .listcard .dish .nm{ font-size:14px; font-weight:600; }
  .listcard .dish .tm{ font-size:11px; color:var(--mut); }
  .weekday{ background:var(--card); border-radius:16px; padding:14px 15px; margin-bottom:12px; box-shadow:0 1px 6px rgba(0,0,0,.04); }
  .weekday h3{ font-size:15px; font-weight:700; margin-bottom:8px; }
  .cart-group{ margin-bottom:16px; } .cart-group h4{ font-size:12px; font-weight:700; color:var(--heroAcc); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 8px; }
  .cart-item{ display:flex; align-items:center; gap:10px; background:var(--card); border-radius:12px; padding:11px 13px; margin-bottom:7px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.03); }
  .cart-item .box{ width:20px; height:20px; border-radius:6px; border:2px solid #D8CDBB; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; }
  .cart-item.done .box{ background:var(--kidAcc); border-color:var(--kidAcc); }
  .cart-item .nm{ font-size:14px; } .cart-item .qty{ font-size:12px; color:var(--mut); margin-left:auto; }
  .cart-item.done .nm{ text-decoration:line-through; color:var(--mut); }
  .banner{ background:#FBE7B0; color:#7A4E12; font-size:12px; border-radius:12px; padding:10px 12px; margin:10px 0; text-align:center; }
  .nav{ position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:#fff;
    display:flex; justify-content:space-around; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #eee; }
  .nav button{ background:none; border:none; font-size:22px; cursor:pointer; opacity:.4; padding:6px 14px; }
  .nav button.on{ opacity:1; transform:translateY(-1px); }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:50; }
  .sheet{ background:var(--bg); width:100%; max-width:480px; margin:0 auto; border-radius:24px 24px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto; }
  .sheet .close{ float:right; background:#EDE3D3; border:none; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; color:#7A4E12; }
  .sheet .em{ font-size:40px; } .sheet h2{ font-size:20px; font-weight:800; margin:6px 0 2px; } .sheet .tm{ font-size:12px; color:var(--mut); margin-bottom:16px; }
  .sheet h5{ font-size:12px; font-weight:700; color:var(--heroAcc); text-transform:uppercase; letter-spacing:.5px; margin:14px 0 8px; }
  .sheet ol{ padding-left:18px; } .sheet li{ font-size:14px; line-height:1.7; }
  .sheet .ing{ display:flex; justify-content:space-between; font-size:14px; padding:5px 0; border-bottom:1px solid #EFE6D6; } .sheet .ing .q{ color:var(--mut); }
  .empty{ text-align:center; color:var(--mut); font-size:14px; padding:40px 20px; }

  .hero{ min-height:236px; }
  .hero h1,.hero .h2,.hero p,.hero .herometa{ max-width:56%; position:relative; z-index:1; }
  .herometa{ font-size:11px; color:#7A4E12; font-weight:600; margin-top:10px; }

var DATA=null, usedFallback=false, BUCKETS=null;
var state={ tab:'home', week:0, day:0, recipe:null, checked:{} };

try{ if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); } }catch(e){}

function loadData(){
  fetch('data.json?v='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){ DATA=j; start(); })
    .catch(function(){ if(FALLBACK){ DATA=FALLBACK; usedFallback=true; start(); }
      else document.getElementById('app').innerHTML='<div class="banner">Не удалось загрузить data.json. Проверь, что файл лежит рядом с index.html.</div>'; });
}
function start(){ buildBuckets(); document.getElementById('nav').style.display='flex'; render(); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dish(id){ return DATA.dishes[id]; }

/* --- Движок ротации: корзины (аудитория × приём пищи), без повторов --- */
function buildBuckets(){
  BUCKETS={};
  DATA.meals.forEach(function(m){ ['adults','kids'].forEach(function(a){ BUCKETS[a+'|'+m]=[]; }); });
  Object.keys(DATA.dishes).sort().forEach(function(id){ var d=dish(id); var k=d.audience+'|'+d.meal; if(BUCKETS[k]) BUCKETS[k].push(id); });
}
function genMeals(aud, W, d){ var meals={}, used={}; DATA.meals.forEach(function(m){ var b=BUCKETS[aud+'|'+m]||[]; if(!b.length) return; var i=(W+d)%b.length, t=0; while(t<b.length && used[DATA.dishes[b[i]].name]){ i=(i+1)%b.length; t++; } meals[m]=b[i]; used[DATA.dishes[b[i]].name]=true; }); return meals; }
function generateWeek(W){ var out=[]; for(var d=0;d<7;d++){ out.push({ short:DATA.daysShort[d], day:DATA.days[d], adults:genMeals('adults',W,d), kids:genMeals('kids',W,d) }); } return out; }

function go(tab){ state.tab=tab; state.recipe=null; render(); window.scrollTo(0,0); }
function pickDay(i){ state.day=i; render(); }
function prevWeek(){ if(state.week>0){ state.week--; render(); } }
function nextWeek(){ state.week++; render(); }
function openRecipe(id){ state.recipe=id; render(); }
function closeRecipe(){ state.recipe=null; render(); }
function toggle(key){ state.checked[key]=!state.checked[key]; render(); }

function weekSwitch(){
  var W=state.week;
  return '<div class="wksw">'+
    '<button onclick="prevWeek()" '+(W===0?'disabled':'')+'>‹</button>'+
    '<div class="wk">Неделя '+(W+1)+(W===0?' <small>· текущая</small>':'')+'</div>'+
    '<button onclick="nextWeek()">›</button></div>';
}
function menuBlock(cls,label,icon,meals){
  var rows=Object.keys(meals).map(function(mt){ var d=dish(meals[mt]); if(!d) return '';
    return '<div class="row" onclick="openRecipe(\''+meals[mt]+'\')"><span>'+mt+'</span><span class="val">'+esc(d.name)+' '+d.emoji+'</span></div>'; }).join('');
  return '<div class="menu '+cls+'"><div class="lbl">'+icon+' '+label+'</div>'+rows+'</div>';
}

function viewHome(){
  var wk=generateWeek(state.week); var w=wk[state.day];
  var pal=['#ED93B1','#FAC775','#97C459','#85B7EB','#AFA9EC','#F0A6C0','#7FCBA6'];
  var ink=['#4B1528','#633806','#173404','#042C53','#26215C','#5A1230','#0F5138'];
  var days=wk.map(function(d,i){ var on=i===state.day;
    return '<button class="day'+(on?' on':'')+'" style="'+(on?('background:'+pal[i]+';color:'+ink[i]):'')+'" onclick="pickDay('+i+')">'+d.short+'</button>'; }).join('');
  var count=Object.keys(w.adults).length+Object.keys(w.kids).length;
  return '<div class="topbar"><div class="hello">Привет, <b>'+esc(DATA.user.name)+'</b></div>'+
      '<div class="avatar">'+esc((DATA.user.name||'?').charAt(0))+'</div></div>'+
    weekSwitch()+
    '<div class="hero"><div class="hero-figure"></div><h1>Меню</h1><div class="h2 serif">на неделю</div>'+
      '<p>Спланируй, посмотри рецепты, собери покупки</p>'+
      '<div class="sticker1"><b>'+count+'</b><span>блюд</span></div>'+
      '<div class="sticker2">сегодня '+esc(w.short)+'</div></div>'+
    '<div class="days">'+days+'</div>'+
    '<div class="sec-title">Меню · '+esc(w.day.toLowerCase())+'</div>'+
    menuBlock('adult','ВЗРОСЛЫЕ','👨‍👩',w.adults)+
    menuBlock('kid','ДЕТИ','🧒',w.kids)+
    '<div class="tiles">'+
      '<div class="tile rec" onclick="go(\'rec\')"><div class="ic">📖</div><div class="tt">Рецепты</div></div>'+
      '<div class="tile fav" onclick="go(\'fav\')"><div class="ic">❤️</div><div class="tt">Избранное</div></div></div>'+
    '<button class="cta" onclick="go(\'cart\')">🛒 Собрать список покупок</button>';
}

function viewWeek(){
  var wk=generateWeek(state.week);
  var out='<div class="page-h">Неделя <span class="serif">целиком</span></div>'+weekSwitch();
  wk.forEach(function(w){
    function line(meals){ return Object.keys(meals).map(function(mt){ var d=dish(meals[mt]);
      return '<div class="row" onclick="openRecipe(\''+meals[mt]+'\')"><span>'+mt+'</span><span class="val">'+esc(d.name)+' '+d.emoji+'</span></div>'; }).join(''); }
    out+='<div class="weekday"><h3>'+esc(w.day)+'</h3>'+
      '<div class="menu adult" style="margin-bottom:8px"><div class="lbl">👨‍👩 ВЗРОСЛЫЕ</div>'+line(w.adults)+'</div>'+
      '<div class="menu kid"><div class="lbl">🧒 ДЕТИ</div>'+line(w.kids)+'</div></div>';
  });
  return out;
}

function dishCard(id){ var d=dish(id); if(!d) return '';
  return '<div class="listcard"><div class="dish" onclick="openRecipe(\''+id+'\')"><div class="em">'+d.emoji+'</div>'+
    '<div><div class="nm">'+esc(d.name)+'</div><div class="tm">⏱ '+esc(d.time)+'</div></div></div></div>'; }
function viewRecipes(){ var out='<div class="page-h">Все <span class="serif">рецепты</span></div>';
  Object.keys(DATA.dishes).sort().forEach(function(id){ out+=dishCard(id); }); return out; }
function viewFav(){ var out='<div class="page-h">Избранные <span class="serif">блюда</span></div>';
  if(!DATA.favorites||!DATA.favorites.length) return out+'<div class="empty">Пока пусто.</div>';
  DATA.favorites.forEach(function(id){ out+=dishCard(id); }); return out; }

function buildShopping(){
  var wk=generateWeek(state.week), acc={};
  wk.forEach(function(w){ [w.adults,w.kids].forEach(function(meals){ Object.keys(meals).forEach(function(mt){
    var d=dish(meals[mt]); if(!d) return; d.ingredients.forEach(function(ing){
      acc[ing.group]=acc[ing.group]||{}; acc[ing.group][ing.name]=(acc[ing.group][ing.name]||0)+1; }); }); }); });
  return acc;
}
function viewCart(){
  var acc=buildShopping(); var order=DATA.groups||Object.keys(acc);
  var out='<div class="page-h">Список <span class="serif">покупок</span></div>'+weekSwitch()+
    '<div style="font-size:12px;color:var(--mut);margin:0 2px 14px">Собрано из меню на неделю '+(state.week+1)+'. Нажми, чтобы отметить купленное.</div>';
  order.forEach(function(g){ if(!acc[g]) return;
    var items=Object.keys(acc[g]).sort().map(function(nm){ var n=acc[g][nm]; var key=state.week+'|'+g+'|'+nm; var done=state.checked[key];
      return '<div class="cart-item'+(done?' done':'')+'" onclick="toggle(\''+key.replace(/'/g,'')+'\')">'+
        '<div class="box">'+(done?'✓':'')+'</div><div class="nm">'+esc(nm)+'</div><div class="qty">'+(n>1?('× '+n):'')+'</div></div>'; }).join('');
    out+='<div class="cart-group"><h4>'+esc(g)+'</h4>'+items+'</div>'; });
  return out;
}

function recipeSheet(){
  if(!state.recipe) return ''; var d=dish(state.recipe); if(!d) return '';
  var ings=d.ingredients.map(function(i){ return '<div class="ing"><span>'+esc(i.name)+'</span><span class="q">'+esc(i.qty)+'</span></div>'; }).join('');
  var steps=d.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('');
  return '<div class="modal" onclick="if(event.target===this)closeRecipe()"><div class="sheet">'+
    '<button class="close" onclick="closeRecipe()">✕</button><div class="em">'+d.emoji+'</div><h2>'+esc(d.name)+'</h2>'+
    '<div class="tm">⏱ '+esc(d.time)+'</div><h5>Ингредиенты</h5>'+ings+'<h5>Приготовление</h5><ol>'+steps+'</ol></div></div>';
}

function render(){
  var v='';
  if(state.tab==='home') v=viewHome();
  else if(state.tab==='week') v=viewWeek();
  else if(state.tab==='rec') v=viewRecipes();
  else if(state.tab==='fav') v=viewFav();
  else if(state.tab==='cart') v=viewCart();
  if(usedFallback) v='<div class="banner">⚠ data.json не загрузился — показан встроенный пример (для теста в браузере это норма).</div>'+v;
  document.getElementById('app').innerHTML=v+recipeSheet();
  var navTab=(state.tab==='rec')?'home':state.tab;
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab')===navTab); });
}
loadData();
</script>
</body>
</html>
